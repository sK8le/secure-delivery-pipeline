apiVersion: v1
kind: ServiceAccount
metadata:
  name: vulntrack-viewer
  namespace: vulntrack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: vulntrack
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]   # только чтение, никаких create/delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vulntrack-viewer-can-read
  namespace: vulntrack
subjects:
  - kind: ServiceAccount
    name: vulntrack-viewer
    namespace: vulntrack
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
