name: Baseline (без проверок безопасности)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Запустить тесты
        env:
          VULNTRACK_SECRET_KEY: ${{ secrets.VULNTRACK_SECRET_KEY }}
        run: pytest tests/ -v --tb=short

  build:
    name: Сборка образа
    needs: [tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Собрать образ
        run: docker build -f Dockerfile -t vulntrack:baseline .

  deploy:
    name: Развёртывание
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Развёртывание (без проверок безопасности)
        run: echo "Образ развёрнут без каких-либо проверок безопасности"
