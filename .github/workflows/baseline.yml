name: Baseline CI (функции и сборка)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Общие функциональные тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Запустить тесты
        run: pytest tests/functional/ tests/test_database.py -v --tb=short --junitxml=baseline-tests.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: baseline-test-results
          path: baseline-tests.xml
          if-no-files-found: error

  build:
    name: Сборка образа
    needs: [tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Собрать образ
        run: |
          docker build -f Dockerfile -t vulntrack:ci \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Сохранить образ и сведения о сборке
        run: |
          docker save -o vulntrack-image.tar vulntrack:ci
          python scripts/image_receipt.py build --output image-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-image
          path: |
            vulntrack-image.tar
            image-build.json
          retention-days: 7

